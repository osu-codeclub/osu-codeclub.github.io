# A _brand.yml for Ohio State-styled Quarto documents and Shiny apps
# Colors follow OSU's brand palette; fonts are freely available Google Fonts
# stand-ins for OSU's Buckeye Sans/Serif

meta:
  name:
    short: Ohio State
    full: The Ohio State University
  link: https://www.osu.edu

color:
  palette:
    scarlet: "#BA0C2F"
    gray: "#A7B1B7"
    dark-gray: "#3F4443"
    light-gray: "#F2F2F2"
    black: "#212325"
    white: "#FFFFFF"
  foreground: black
  background: white
  primary: scarlet
  secondary: dark-gray
  light: light-gray
  dark: dark-gray

typography:
  fonts:
    - family: Source Sans 3
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Serif 4
      source: google
      weight: [600, 700]
    - family: Source Code Pro
      source: google
  base:
    family: Source Sans 3
    line-height: 1.5
  headings:
    family: Source Serif 4
    weight: 700
    color: scarlet
  monospace: Source Code Pro
  link:
    color: scarlet
